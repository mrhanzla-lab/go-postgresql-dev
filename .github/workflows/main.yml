name: CI/CD Pipeline - go-postgresql-dev

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: go-postgresql-dev-eks
  DOCKER_IMAGE: go-postgresql-app
  DOCKER_REGISTRY: docker.io
  K8S_NAMESPACE: go-postgresql-dev

jobs:
  # Stage 1: Build & Test
  build-and-test:
    name: "Stage 1: Build & Test"
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Download dependencies
      run: go mod download
      
    - name: Build application
      run: |
        echo "Building Go application..."
        go build -v -o bin/go-postgresqld ./examples/go-postgresqld/
        
    - name: Run tests
      run: |
        echo "Running unit tests..."
        go test -v -coverprofile=coverage.out -timeout 10m ./...
        
    - name: Display test coverage
      run: go tool cover -func=coverage.out
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: bin/
        retention-days: 1

  # Stage 2: Security & Linting
  security-and-linting:
    name: "Stage 2: Security & Linting"
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m
        
    - name: Run gosec security scanner
      uses: securego/gosec@master
      with:
        args: '-no-fail -fmt sarif -out gosec-results.sarif ./...'
        
    - name: Upload security scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: gosec-results.sarif
        
    - name: Trivy vulnerability scanner (filesystem)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --only-verified

  # Stage 3: Docker Build & Push
  docker-build-push:
    name: "Stage 3: Docker Build & Push"
    runs-on: ubuntu-latest
    needs: security-and-linting
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: false
        load: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Scan Docker image for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ secrets.DOCKER_USERNAME }}/${{ env.DOCKER_IMAGE }}:latest
        format: 'sarif'
        output: 'trivy-docker-results.sarif'
        
    - name: Push Docker image
      if: github.event_name != 'pull_request'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

  # Stage 4: Terraform Apply (Infrastructure)
  terraform-infrastructure:
    name: "Stage 4: Terraform Apply"
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    defaults:
      run:
        working-directory: ./infra
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: latest
        
    - name: Terraform Format Check
      run: terraform fmt -check -recursive
      continue-on-error: true
      
    - name: Terraform Init
      run: |
        terraform init -upgrade
        
    - name: Terraform Validate
      run: terraform validate
      
    - name: Terraform Plan
      env:
        TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      run: |
        terraform plan -out=tfplan -input=false
        
    - name: Terraform Apply
      if: github.event_name == 'push'
      env:
        TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      run: |
        terraform apply -auto-approve -input=false tfplan
        
    - name: Save Terraform Outputs
      if: github.event_name == 'push'
      run: |
        terraform output -json > terraform-outputs.json
        
    - name: Upload Terraform outputs
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: terraform-outputs
        path: infra/terraform-outputs.json
        retention-days: 30

  # Stage 5: Kubernetes Deploy
  kubernetes-deploy:
    name: "Stage 5: Kubectl Apply"
    runs-on: ubuntu-latest
    needs: terraform-infrastructure
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'
        
    - name: Configure kubectl for EKS
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
        
    - name: Verify cluster connection
      run: |
        kubectl cluster-info
        kubectl get nodes
        
    - name: Create namespace (if not exists)
      run: |
        kubectl apply -f k8s/namespace.yaml
        
    - name: Apply ConfigMaps and Secrets
      run: |
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secret.yaml
        
    - name: Deploy Redis
      run: |
        kubectl apply -f k8s/redis-deployment.yaml
        kubectl rollout status deployment/redis -n ${{ env.K8S_NAMESPACE }} --timeout=120s
        
    - name: Deploy RabbitMQ
      run: |
        kubectl apply -f k8s/rabbitmq-deployment.yaml
        kubectl rollout status deployment/rabbitmq -n ${{ env.K8S_NAMESPACE }} --timeout=120s
        
    - name: Deploy Application
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        
    - name: Wait for application rollout
      run: |
        kubectl rollout status deployment/go-postgresql-app -n ${{ env.K8S_NAMESPACE }} --timeout=300s
        
    - name: Get deployment status
      run: |
        echo "=== Pods ==="
        kubectl get pods -n ${{ env.K8S_NAMESPACE }}
        echo ""
        echo "=== Services ==="
        kubectl get services -n ${{ env.K8S_NAMESPACE }}
        echo ""
        echo "=== Deployments ==="
        kubectl get deployments -n ${{ env.K8S_NAMESPACE }}
        
    - name: Save deployment info
      run: |
        kubectl get all -n ${{ env.K8S_NAMESPACE }} > deployment-status.txt
        
    - name: Upload deployment status
      uses: actions/upload-artifact@v4
      with:
        name: deployment-status
        path: deployment-status.txt
        retention-days: 30

  # Stage 6: Post-Deploy Smoke Tests
  smoke-tests:
    name: "Stage 6: Post-Deploy Smoke Tests"
    runs-on: ubuntu-latest
    needs: kubernetes-deploy
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'
        
    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
        
    - name: Test 1 - Check all pods are running
      run: |
        echo "Checking pod status..."
        PODS_NOT_RUNNING=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} --field-selector=status.phase!=Running --no-headers 2>/dev/null | wc -l)
        if [ "$PODS_NOT_RUNNING" -gt 0 ]; then
          echo "❌ Error: Some pods are not running"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          exit 1
        fi
        echo "✅ All pods are running"
        
    - name: Test 2 - Check Redis connectivity
      run: |
        echo "Testing Redis connectivity..."
        REDIS_POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=redis -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n ${{ env.K8S_NAMESPACE }} $REDIS_POD -- redis-cli ping | grep -q "PONG"
        echo "✅ Redis is responding"
        
    - name: Test 3 - Check RabbitMQ connectivity
      run: |
        echo "Testing RabbitMQ connectivity..."
        RABBITMQ_POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=rabbitmq -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n ${{ env.K8S_NAMESPACE }} $RABBITMQ_POD -- rabbitmqctl status > /dev/null
        echo "✅ RabbitMQ is healthy"
        
    - name: Test 4 - Check LoadBalancer service
      run: |
        echo "Checking LoadBalancer service..."
        LB_HOSTNAME=$(kubectl get service go-postgresql-app -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        if [ -z "$LB_HOSTNAME" ]; then
          echo "❌ LoadBalancer hostname not found"
          exit 1
        fi
        echo "✅ LoadBalancer DNS: $LB_HOSTNAME"
        
    - name: Test 5 - HTTP health check
      run: |
        echo "Testing HTTP endpoint..."
        LB_HOSTNAME=$(kubectl get service go-postgresql-app -n ${{ env.K8S_NAMESPACE }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        
        # Wait for DNS propagation and endpoint to be ready
        echo "Waiting for endpoint to be ready (max 60s)..."
        for i in {1..12}; do
          if curl -f -s -o /dev/null -w "%{http_code}" --max-time 5 http://$LB_HOSTNAME | grep -q "200"; then
            echo "✅ HTTP endpoint is responding with 200 OK"
            exit 0
          fi
          echo "Attempt $i/12: Endpoint not ready yet, waiting..."
          sleep 5
        done
        
        echo "⚠️  Warning: Endpoint not responding (may need more time for DNS propagation)"
        echo "LoadBalancer URL: http://$LB_HOSTNAME"
        
    - name: Test 6 - Check environment variables
      run: |
        echo "Verifying environment variables in app pods..."
        APP_POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=go-postgresql-app -o jsonpath='{.items[0].metadata.name}')
        
        echo "Checking DB_HOST..."
        kubectl exec -n ${{ env.K8S_NAMESPACE }} $APP_POD -- env | grep -q "DB_HOST" || exit 1
        
        echo "Checking REDIS_HOST..."
        kubectl exec -n ${{ env.K8S_NAMESPACE }} $APP_POD -- env | grep -q "REDIS_HOST" || exit 1
        
        echo "✅ Environment variables configured correctly"
        
    - name: Test 7 - Service DNS resolution
      run: |
        echo "Testing internal DNS resolution..."
        APP_POD=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -l app=go-postgresql-app -o jsonpath='{.items[0].metadata.name}')
        
        # Test Redis DNS
        kubectl exec -n ${{ env.K8S_NAMESPACE }} $APP_POD -- nslookup redis | grep -q "Address:"
        echo "✅ Redis DNS resolves correctly"
        
        # Test RabbitMQ DNS
        kubectl exec -n ${{ env.K8S_NAMESPACE }} $APP_POD -- nslookup rabbitmq | grep -q "Address:"
        echo "✅ RabbitMQ DNS resolves correctly"
        
    - name: Generate smoke test report
      if: always()
      run: |
        echo "=== Smoke Test Report ===" > smoke-test-report.txt
        echo "Timestamp: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> smoke-test-report.txt
        echo "" >> smoke-test-report.txt
        echo "Pod Status:" >> smoke-test-report.txt
        kubectl get pods -n ${{ env.K8S_NAMESPACE }} >> smoke-test-report.txt
        echo "" >> smoke-test-report.txt
        echo "Service Status:" >> smoke-test-report.txt
        kubectl get services -n ${{ env.K8S_NAMESPACE }} >> smoke-test-report.txt
        
    - name: Upload smoke test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-report
        path: smoke-test-report.txt
        retention-days: 30
        
    - name: Smoke tests completed
      run: |
        echo "========================================="
        echo "✅ All smoke tests passed!"
        echo "========================================="
        echo "Deployment is healthy and ready for use."

  # Summary job
  pipeline-summary:
    name: "Pipeline Summary"
    runs-on: ubuntu-latest
    needs: [build-and-test, security-and-linting, docker-build-push, terraform-infrastructure, kubernetes-deploy, smoke-tests]
    if: always()
    
    steps:
    - name: Check pipeline status
      run: |
        echo "========================================="
        echo "        CI/CD Pipeline Summary"
        echo "========================================="
        echo ""
        echo "Stage 1 - Build & Test: ${{ needs.build-and-test.result }}"
        echo "Stage 2 - Security & Linting: ${{ needs.security-and-linting.result }}"
        echo "Stage 3 - Docker Build & Push: ${{ needs.docker-build-push.result }}"
        echo "Stage 4 - Terraform Apply: ${{ needs.terraform-infrastructure.result }}"
        echo "Stage 5 - Kubectl Apply: ${{ needs.kubernetes-deploy.result }}"
        echo "Stage 6 - Smoke Tests: ${{ needs.smoke-tests.result }}"
        echo ""
        echo "========================================="
        
        if [ "${{ needs.smoke-tests.result }}" == "success" ]; then
          echo "✅ Pipeline completed successfully!"
          exit 0
        else
          echo "❌ Pipeline failed or was skipped"
          exit 1
        fi
