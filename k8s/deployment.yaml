apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-postgresql-app
  namespace: go-postgresql-dev
  labels:
    app: go-postgresql-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-postgresql-app
  template:
    metadata:
      labels:
        app: go-postgresql-app
    spec:
      containers:
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 80
          name: http
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: go-postgresql-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: go-postgresql-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: go-postgresql-config
              key: DB_NAME
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: go-postgresql-secret
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: go-postgresql-secret
              key: DB_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: go-postgresql-config
              key: REDIS_HOST
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: go-postgresql-config
              key: RABBITMQ_HOST
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: go-postgresql-config
              key: APP_ENV
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
