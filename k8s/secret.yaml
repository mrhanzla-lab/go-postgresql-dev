apiVersion: v1
kind: Secret
metadata:
  name: go-postgresql-secret
  namespace: go-postgresql-dev
type: Opaque
stringData:
  # PostgreSQL Credentials (base64 encoded in real deployment)
  DB_USERNAME: "dbadmin"
  DB_PASSWORD: "SecurePassword123456"
  
  # Redis Password (if needed)
  REDIS_PASSWORD: ""
  
  # RabbitMQ Credentials
  RABBITMQ_USERNAME: "admin"
  RABBITMQ_PASSWORD: "admin123"
